<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="topbar">
        <h1>Rock Paper Scissors</h1>
      </header>

      <main class="game-panel">
        <div class="scoreboard">
          <div class="score-box">
            <span class="label">Player</span>
            <span id="player-score">0</span>
          </div>
          <div class="score-box center-box">
            <span class="label">Round</span>
            <span id="round-number">1</span>
          </div>
          <div class="score-box">
            <span class="label">Computer</span>
            <span id="computer-score">0</span>
          </div>
        </div>

        <div class="display-area">
          <div class="choice-panel">
            <div class="choice-box player-box">
              <p class="choice-label">You picked</p>
              <span id="player-choice" class="choice-value">?</span>
            </div>
            <div class="versus">VS</div>
            <div class="choice-box computer-box">
              <p class="choice-label">Computer picked</p>
              <span id="computer-choice" class="choice-value">?</span>
            </div>
          </div>

          <div id="result" class="result">Make your move!</div>
        </div>

        <div class="controls">
          <button class="move-btn" data-move="rock" aria-label="Choose rock">
            <span>✊</span>
            <small>Rock</small>
          </button>
          <button class="move-btn" data-move="paper" aria-label="Choose paper">
            <span>✋</span>
            <small>Paper</small>
          </button>
          <button class="move-btn" data-move="scissors" aria-label="Choose scissors">
            <span>✌️</span>
            <small>Scissors</small>
          </button>
        </div>

        <div class="actions">
          <button id="reset-btn" class="reset-btn">Reset Score</button>
        </div>
      </main>
    </div>

    <audio id="win-sound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_2f541b9312.mp3?filename=success-fanfare-trumpets-231277.mp3"></audio>
    <audio id="lose-sound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_49f58fdda4.mp3?filename=negative-beeps-1062.mp3"></audio>
    <audio id="tie-sound" preload="auto" src="https://cdn.pixabay.com/download/audio/2022/01/18/audio_5d5cf3f9af.mp3?filename=soft-click-14639.mp3"></audio>

    <script src="script.js"></script>
  </body>
</html>
